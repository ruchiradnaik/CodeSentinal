# =============================================================================
# CodeSentinel CI Pipeline
# Runs on every push and pull request
# =============================================================================

name: CI Pipeline

on:
  push:
    branches: [main, develop, ruchir_jan_changes]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # ===========================================================================
  # Linting & Code Quality
  # ===========================================================================
  lint:
    name: 🔍 Lint & Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort pylint

      - name: 🎨 Check formatting with Black
        run: |
          black --check --line-length=120 *.py || echo "::warning::Code formatting issues found"
        continue-on-error: true

      - name: 📋 Check import sorting with isort
        run: |
          isort --check-only --profile black *.py || echo "::warning::Import sorting issues found"
        continue-on-error: true

      - name: 🔍 Lint with flake8
        run: |
          flake8 *.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 *.py --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

  # ===========================================================================
  # Unit Tests
  # ===========================================================================
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock

      - name: 🧪 Run unit tests
        run: |
          python -m pytest tests/unit/ -v --tb=short --ignore=tests/unit/test_executor.py || true
        env:
          OPENAI_API_KEY: "test-key-for-ci"
          OPEN_API_KEY: "test-key-for-ci"
          GITHUB_TOKEN: "test-token-for-ci"
          DOCKER_ENABLED: "false"
          ENVIRONMENT: "testing"
          PYTHONPATH: ${{ github.workspace }}

      - name: 🧪 Run executor tests (allow failures)
        run: |
          python -m pytest tests/unit/test_executor.py -v --tb=short || echo "::warning::Some executor tests failed (expected in CI without Docker)"
        env:
          OPENAI_API_KEY: "test-key-for-ci"
          OPEN_API_KEY: "test-key-for-ci"
          GITHUB_TOKEN: "test-token-for-ci"
          DOCKER_ENABLED: "false"
          ENVIRONMENT: "testing"
          PYTHONPATH: ${{ github.workspace }}
        continue-on-error: true

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            .pytest_cache/
          retention-days: 7

  # ===========================================================================
  # Integration Tests
  # ===========================================================================
  integration-test:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock

      - name: 🔗 Run integration tests
        run: |
          python -m pytest tests/integration/ -v --tb=short || echo "::warning::Some integration tests failed"
        env:
          OPENAI_API_KEY: "test-key-for-ci"
          OPEN_API_KEY: "test-key-for-ci"
          GITHUB_TOKEN: "test-token-for-ci"
          DOCKER_ENABLED: "false"
          ENVIRONMENT: "testing"
          PYTHONPATH: ${{ github.workspace }}
        continue-on-error: true

  # ===========================================================================
  # Security Scan
  # ===========================================================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: 🔒 Run Bandit security scan
        run: |
          bandit -r . -x ./tests,./venv,./.venv -ll -ii || echo "::warning::Security issues found"
        continue-on-error: true

      - name: 🛡️ Check dependencies for vulnerabilities
        run: |
          pip install -r requirements.txt
          safety check || echo "::warning::Vulnerable dependencies found"
        continue-on-error: true

  # ===========================================================================
  # Docker Build
  # ===========================================================================
  docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [test, integration-test]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build main Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: codesentinel:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build sandbox Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.sandbox
          push: false
          tags: codesentinel-sandbox:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Summary
  # ===========================================================================
  ci-summary:
    name: ✅ CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, integration-test, security, docker]
    if: always()
    
    steps:
      - name: 📋 CI Pipeline Summary
        run: |
          echo "## CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.docker.result }} |" >> $GITHUB_STEP_SUMMARY
